name: Örnek reliability checks
on:
  push:
    paths:
      - 'site/**'
      - 'scripts/site-health.cjs'
      - 'scripts/verify-*.cjs'
      - '.github/workflows/site-health.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'scripts/site-health.cjs'
      - 'scripts/verify-*.cjs'
      - '.github/workflows/site-health.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ornek-health-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  source-integrity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check source files, scripts, and syntax
        run: node scripts/site-health.cjs local
      - name: Verify math, reading, history, physics and dashboards
        run: |
          node scripts/verify-math-bank.cjs
          node scripts/verify-literacy-fresh-800.cjs
          node scripts/verify-history-difficulty.cjs
          node scripts/verify-physics.cjs
          node scripts/verify-subject-dashboards.cjs

  live-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORNEK_BASE_URL: https://ornek-ubt.vercel.app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check homepage, production assets and chat method guard
        run: node scripts/site-health.cjs remote

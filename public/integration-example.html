<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Örnek — Құпиялық модулінің сынағы</title><link rel="stylesheet" href="/ornek-privacy.css"><script defer src="/ornek-privacy.js"></script></head><body style="margin:0;background:#f6f8fa;font:16px system-ui;color:#182633"><main style="max-width:660px;margin:40px auto;padding:24px"><h1>Örnek · Құпиялық модулін тексеру</h1><p>Бұл бет — тек демонстрация. Ешқандай тіркелу, Google авторизациясы немесе деректерді серверге жіберу орындалмайды.</p><section style="padding:22px;background:white;border-radius:16px;border:1px solid #e2e9ee"><h2>Тіркелу келісімінің көрінісі</h2><form data-ornek-consent-form id="demo-form"><label>E-mail (сынақ): <input type="email" required placeholder="example@mail.com" style="padding:10px;width:100%;margin-top:8px"></label><button type="submit" style="padding:10px 18px;background:#0e7a70;color:white;border:0;border-radius:8px">Форманы тексеру</button></form><p id="demo-result" role="status"></p></section><footer data-ornek-privacy-footer style="margin-top:28px"></footer></main><script>document.addEventListener('DOMContentLoaded',()=>{document.getElementById('demo-form').addEventListener('submit',e=>{e.preventDefault();document.getElementById('demo-result').textContent='Келісім белгісі тексерілді. Ешқандай дерек жіберілмеді.';});});</script></body></html>

<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f7ff">
  <meta name="robots" content="noindex,nofollow">
  <title>Кіруді растау — Örnek</title>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #27223c; background: #f8f7ff }
    * { box-sizing: border-box }
    body { margin: 0; min-height: 100vh }
    .screen {
      min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      padding: 24px; position: relative; overflow: hidden;
      background:
        radial-gradient(ellipse 550px 350px at 10% 15%, rgba(125,92,255,.13), transparent 78%),
        radial-gradient(ellipse 520px 410px at 95% 95%, rgba(163,122,255,.16), transparent 80%),
        #f9f8ff;
    }
    .screen::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(107,70,200,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(107,70,200,.035) 1px, transparent 1px);
      background-size: 48px 48px; mask-image: linear-gradient(to bottom, transparent, black 30%, transparent);
    }
    .panel {
      width: min(440px,100%); position: relative; background: rgba(255,255,255,.92);
      border: 1px solid #e9e3ff; box-shadow: 0 22px 85px rgba(70,37,130,.09);
      border-radius: 28px; padding: 38px 36px 34px; text-align: center;
    }
    .brand { display:flex; align-items:center; justify-content:center; gap:9px; font-size:24px; font-weight:850; letter-spacing:-.06em; color:#281c53 }
    .mark { width:43px; height:43px; border-radius:13px; display:grid; place-items:center;
      background:#6f47e8; color:white; font-size:27px; font-weight:900; letter-spacing:-.08em;
      box-shadow:0 6px 16px rgba(103,69,215,.24) }
    .brand span:last-child { color:#8a63fc }
    .lock { margin:33px auto 20px; display:grid; place-items:center; width:64px; height:64px;
      border:1px solid #e4dcff; border-radius:20px; background:#f3efff; color:#6f47e8 }
    .lock svg { width:29px; height:29px }
    h1 { margin:0; font-size: clamp(25px,4.7vw,30px); line-height:1.2; letter-spacing:-.047em; font-weight:800 }
    .description { font-size:14px; color:#777188; line-height:1.65; margin:13px auto 29px; max-width:315px }
    label { display:block; text-align:left; font-size:13px; font-weight:700; margin-bottom:9px; color:#4f4768 }
    input {
      width:100%; height:59px; border:1.5px solid #ded8ef; border-radius:14px; background:#fff;
      color:#302354; font-size:23px; font-weight:750; letter-spacing:.45em; text-align:center;
      padding:0 18px 0 28px; outline:none; transition:border .2s,box-shadow .2s;
    }
    input:focus { border-color:#7e5df2; box-shadow:0 0 0 4px rgba(126,93,242,.13) }
    input[aria-invalid="true"] { border-color:#dc5a69 }
    button {
      display:block; margin-top:15px; width:100%; height:54px; border:0; border-radius:14px;
      background:linear-gradient(110deg,#7652ed,#6036d5); color:#fff; font:750 15px inherit;
      font-family:inherit; font-weight:750; font-size:15px; cursor:pointer; box-shadow:0 9px 18px rgba(101,66,217,.19);
      transition:transform .18s, opacity .18s, box-shadow .18s;
    }
    button:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 11px 24px rgba(101,66,217,.25) }
    button:disabled { cursor:not-allowed; opacity:.62 }
    .error { min-height:20px; margin:12px 0 0; font-size:13px; line-height:1.5; color:#ba304c; font-weight:600 }
    .foot { margin:16px 0 0; color:#a29bae; font-size:12px }
    @media (max-width:480px) { .panel { padding:29px 22px 26px; border-radius:23px } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important } }
  </style>
</head>
<body>
  <main class="screen">
    <section class="panel" aria-labelledby="title">
      <div class="brand"><div class="mark" aria-hidden="true">Ö</div> Örnek<span>.</span></div>
      <div class="lock" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="10" width="14" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/><path d="M12 14.2v2.5"/>
        </svg>
      </div>
      <h1 id="title">Сайтқа кіру</h1>
      <p class="description">Örnek платформасын ашу үшін үш таңбалы растау кодын енгізіңіз.</p>
      <form id="gate-form" novalidate>
        <label for="gate-code">Растау коды</label>
        <input id="gate-code" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" placeholder="•••" required autofocus aria-describedby="gate-error">
        <button id="gate-submit" type="submit">Сайтты ашу</button>
        <p id="gate-error" class="error" role="status" aria-live="polite"></p>
      </form>
      <p class="foot">Örnek · ҰБТ-ға дайындық платформасы</p>
    </section>
  </main>
  <script>
    (function () {
      var form = document.getElementById('gate-form');
      var input = document.getElementById('gate-code');
      var button = document.getElementById('gate-submit');
      var error = document.getElementById('gate-error');
      input.focus();
      input.addEventListener('input', function () {
        input.value = input.value.replace(/\D/g, '').slice(0,3);
        input.removeAttribute('aria-invalid');
        error.textContent = '';
      });
      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        if (!/^\d{3}$/.test(input.value)) {
          error.textContent = 'Үш таңбалы кодты енгізіңіз.';
          input.setAttribute('aria-invalid','true');
          return;
        }
        button.disabled = true;
        button.textContent = 'Тексерілуде…';
        try {
          var response = await fetch('/api/gate-verify', {
            method:'POST', credentials:'same-origin',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({code:input.value}),
            cache:'no-store'
          });
          var data = await response.json();
          if (response.ok && data.ok === true) {
            window.location.replace(window.location.pathname === '/gate.html' ? '/' : window.location.pathname + window.location.search);
            return;
          }
          input.value = '';
          input.setAttribute('aria-invalid','true');
          if (response.status === 429) {
            error.textContent = 'Көп қате әрекет. ' + (data.retryAfter || 60) + ' секундтан кейін қайталаңыз.';
          } else if (response.status === 401) {
            error.textContent = 'Код қате. Қалған мүмкіндік: ' + data.attemptsRemaining + '.';
          } else {
            error.textContent = 'Растау мүмкін болмады. Қайталап көріңіз.';
          }
          input.focus();
        } catch {
          error.textContent = 'Байланысты тексеріп, қайталап көріңіз.';
        } finally {
          button.disabled = false;
          button.textContent = 'Сайтты ашу';
        }
      });
    })();
  </script>
</body>
</html>

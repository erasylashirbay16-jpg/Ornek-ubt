name: Verify Örnek mobile startup in Chromium
on:
  push:
    paths:
      - 'site/boot.js'
      - 'site/index.html'
      - 'scripts/verify-mobile-startup.cjs'
      - '.github/workflows/verify-mobile-startup.yml'
  workflow_dispatch:

concurrency:
  group: ornek-mobile-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install isolated browser testing dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify mobile first paint, full startup and early subject routing
        run: node scripts/verify-mobile-startup.cjs
